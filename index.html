.passbox{border-radius:20px;padding:22px;background:#eaf9f1;border:1px solid #cdebdc}.retrybox{border-radius:20px;padding:22px;background:#fff6e6;border:1px solid #f0ddb7}.failbox{border-radius:20px;padding:22px;background:#fdeeee;border:1px solid #f3cccc}.slow-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.slow-fact{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}.slow-fact strong{font-size:15px}.slow-fact small{display:block;color:var(--muted);margin-top:2px}

/* V3: family platform, leaderboards and versioned course studio */
.platform-shell{max-width:1080px;margin:36px auto;padding:0 18px 50px}.platform-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.platform-brand .logo{width:48px;height:48px}.gateway-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.access-card{padding:28px}.access-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;font-weight:900}.account-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;margin:9px 0;background:#fff}.child-switch{display:flex;align-items:center;gap:8px}.top-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:850;color:var(--ink)}.family-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.child-card{padding:19px;position:relative}.avatar{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#eeeaff,#d8efff);display:grid;place-items:center;font-size:26px;margin-bottom:10px}.privacy-pill{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#eef7ff;color:#356ca8}.privacy-pill.off{background:#f2f3f6;color:#737b8d}.leaderboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.leaderboard-card{overflow:hidden;padding:0}.leaderboard-head{padding:16px 18px;border-bottom:1px solid var(--line);background:#fafaff}.leader-row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid #eef0f4}.leader-row:last-child{border-bottom:0}.leader-row.you{background:#f1efff}.rank{font-size:17px;font-weight:950}.medal{font-size:22px}.owner-banner{background:linear-gradient(135deg,#172033,#2d3d66);color:#fff}.owner-banner .muted{color:#d7dced}.code-row{display:grid;grid-template-columns:1.2fr 1fr .7fr .7fr .7fr auto;gap:10px;align-items:center;padding:11px function freshFluencyState(){const levels={};FLUENCY_LEVELS.forEach(l=>levels[l.id]={attempts:0,mastered:false,lastSec:null,lastCorrect:0,bestPerfectSec:null,bestCorrect:0,lastDate:null});return{levels,facts:{},history:[],placement:{}}}
function mergeFluency(raw){const f=freshFluencyState(),r=raw||{};return{...f,...r,levels:{...f.levels,...(r.levels||{})},facts:{...(r.facts||{})},history:Array.isArray(r.history)?r.history:[]}}
function fluencyLevelState(id){if(!state.fluency)state.fluency=freshFluencyState();if(!state.fluency.levels[id])state.fluency.levels[id]={attempts:0,mastered:false,lastSec:null,lastCorrect:0,bestPerfectSec:null,bestCorrect:0,lastDate:null};return state.fluency.levels[id]}
function fluencyTarget(l){const custom=state.settings?.fluencyTargets?.[l.id];return Number(custom)||l.targetSec}
function fluencyUnlocked(l){return !l.requires.length||l.requires.every(id=>FLUENCY_BY_ID[id]?fluencyLevelState(id).mastered:true)}
function firstUnmastered(op){return FLUENCY_LEVELS.find(l=>l.op===op&&fluencyUnlocked(l)&&!fluencyLevelState(l.id).mastered)||FLUENCY_LEVELS.find(l=>l.op===op&&!fluencyLevelState(l.id).mastered)||FLUENCY_LEVELS.filter(l=>l.op===op).slice(-1)[0]}
function fluencyMasteredCount(op){return FLUENCY_LEVELS.filter(l=>l.op===op&&fluencyLevelState(l.id).mastered).length}
function factObj(key,label){if(!state.fluency.facts[key])state.fluency.facts[key]={label,attempts:0,correct:0,totalMs:0,bestMs:null,lastMs:null,wrong:0};return state.fluency.facts[key]}
function fq(prompt,answer,key,label=prompt){return{prompt,answer,display:String(answer),factKey:key,factLabel:label}}
function factKey(op,a,b){return `${op}:${a}:${b}`}
function makeFluencyBank(l){let out=[];const p=l.params||{};
 const add=(a,b)=>out.push(fq(`${a} + ${b}`,a+b,factKey('add',a,b),`${a} + ${b}`));
 const sub=(a,b)=>out.push(fq(`${a} − ${b}`,a-b,factKey('sub',a,b),`${a} − ${b}`));
 const mul=(a,b)=>out.push(fq(`${a} × ${b}`,a*b,factKey('mul',a,b),`${a} × ${b}`));
 const div=(n,d)=>out.push(fq(`${n} ÷ ${d}`,n/d,factKey('div',n,d),`${n} ÷ ${d}`));
 switch(l.kind){
  case'addFixedFact':{const n=p.addend;for(let a=p.minBase??0;a<=p.maxBase;a++){add(a,n);if(p.commute&&a!==n)add(n,a)}break}
  case'addMixedFacts':for(let n=p.minAddend;n<=p.maxAddend;n++)for(let a=p.minBase??0;a<=p.maxBase;a++){add(a,n);if(p.commute&&a!==n)add(n,a)}break;
  case'subFixedFact':{const n=p.subtrahend;for(let base=p.minBase??0;base<=p.maxBase;base++)sub(base+n,n);break}
  case'subMixedFacts':for(let n=p.minSub;n<=p.maxSub;n++)for(let base=p.minBase??0;base<=p.maxBase;base++)sub(base+n,n);break;
  case'addSum':for(let a=p.minOperand||0;a<=p.maxSum;a++)for(let b=p.minOperand||0;b<=p.maxSum;b++)if(a+b<=p.maxSum)add(a,b);break;
  case'addOperands':for(let a=p.min||1;a<=p.max;a++)for(let b=p.min||1;b<=p.max;b++)add(a,b);break;
  case'addBridge10':for(let a=2;a<=9;a++)for(let b=2;b<=9;b++)if(a+b>10&&a+b<=18)add(a,b);break;
  case'addTens':for(let a=10;a<=p.maxTotal-10;a+=10)for(let b=10;b<=p.maxTotal-a;b+=10)add(a,b);break;
  case'add2d1dNoBridge':for(let a=10;a<=p.max;a++)for(let b=1;b<=9;b++)if(a+b<=p.max&&(a%10)+b<10)add(a,b);break;
  case'add2d1dBridge':for(let a=10;a<=p.max;a++)for(let b=1;b<=9;b++)if(a+b<=p.max&&(a%10)+b>=10)add(a,b);break;
  case'addWithin':for(let a=p.minA||1;a<=p.max;a++)for(let b=p.minB||1;b<=p.max-a;b++)if(a+b<=p.max)add(a,b);break;
  case'add2d2dNoBridge':for(let a=10;a<=p.max;a++)for(let b=10;b<=Math.min(p.max,99-a);b++)if((a%10)+(b%10)<10&&a+b<=p.max)add(a,b);break;
  case'add2d2dBridge':for(let a=10;a<=p.max;a++)for(let b=10;b<=Math.min(p.max,99-a);b++)if((a%10)+(b%10)>=10&&a+b<=p.max)add(a,b);break;
  case'subWithin':for(let a=1;a<=p.max;a++)for(let b=0;b<=a;b++)if(a-b>=(p.minResult||0))sub(a,b);break;
  case'subBridge10':for(let a=11;a<=19;a++)for(let b=2;b<=9;b++)if(a-b<10&&a-b>=0)sub(a,b);break;
  case'subTens':for(let a=20;a<=p.max;a+=10)for(let b=10;b<a;b+=10)sub(a,b);break;
  case'sub2d1dNoBridge':for(let a=10;a<=p.max;a++)for(let b=1;b<=9;b++)if((a%10)>=b)sub(a,b);break;
  case'sub2d1dBridge':for(let a=11;a<=p.max;a++)for(let b=1;b<=9;b++)if((a%10)<b&&a-b>=0)sub(a,b);break;
  case'subWithinRange':for(let a=p.minA||10;a<=p.max;a++)for(let b=1;b<a;b++)sub(a,b);break;
  case'sub2d2dNoBridge':for(let a=20;a<=p.max;a++)for(let b=10;b<a;b++)if((a%10)>=(b%10))sub(a,b);break;
  case'sub2d2dBridge':for(let a=20;a<=p.max;a++)for(let b=10;b<a;b++)if((a%10)<(b%10))sub(a,b);break;
  case'timesTable':for(let b=1;b<=12;b++){mul(p.table,b);if(b!==p.table)mul(b,p.table)}break;
  case'timesMixed':for(const t of p.tables)for(let b=1;b<=12;b++){mul(t,b);if(t!==b)mul(b,t)}break;
  case'divideTable':for(let q=1;q<=12;q++)div(p.table*q,p.table);break;
  case'divideMixed':for(const t of p.tables)for(let q=1;q<=12;q++)div(t*q,t);break;
 }
 return out;
}
function makeFluencySet(l){let bank=shuffle(makeFluencyBank(l)),out=[];if(!bank.length)return[];while(out.length<l.count){if(!bank.length)bank=shuffle(makeFluencyBank(l));out.push(bank.pop())}return out}
function updateFactTiming(q,ok,ms){const x=factObj(q.factKey,q.factLabel);x.attempts++;if(ok)x.correct++;else x.wrong++;x.totalMs+=ms;x.lastMs=ms;x.bestMs=x.bestMs==null?ms:Math.min(x.bestMs,ms)}
function slowFactsForLevel(id,n=6){const l=FLUENCY_BY_ID[id],keys=new Set(makeFluencyBank(l).map(q=>q.factKey));return Object.entries(state.fluency?.facts||{}).filter(([k,x])=>keys.has(k)&&x.attempts>0).map(([k,x])=>({...x,key:k,avgMs:Math.round(x.totalMs/x.attempts),acc:Math.round(x.correct/x.attempts*100)})).sort((a,b)=>(b.wrong-a.wrong)||(b.avgMs-a.avgMs)).slice(0,n)}

 document.querySelectorAll('[data-fluency-op]').forEach(b=>b.onclick=()=>renderFluency(b.dataset.fluencyOp));document.querySelectorAll('[data-start-fluency]').forEach(b=>b.onclick=()=>startFluencySet(b.dataset.startFluency));const sc=document.getElementById('startCurrent');if(sc&&current)sc.onclick=()=>startFluencySet(current.id)
}
function fluencyLevelCard(l,i,currentId){const x=fluencyLevelState(l.id),unlocked=fluencyUnlocked(l),target=fluencyTarget(l),best=x.bestPerfectSec;let cls=x.mastered?'mastered':(!unlocked?'locked':(currentId===l.id?'current':''));let status=x.mastered?'✅ Mastered':!unlocked?'🔒 Locked':x.attempts?'🔁 Keep practising':'▶ Ready';let reason='';if(!unlocked){const req=l.requires.filter(id=>FLUENCY_BY_ID[id]&&!fluencyLevelState(id).mastered).map(id=>FLUENCY_BY_ID[id].name);reason=req.length?`Master ${req.join(' + ')} first.`:''}return`<div class="mastery-card ${cls}"><div class="stepnum">${x.mastered?'✓':i+1}</div><div><h3>${esc(l.name)}</h3><p>${l.count} questions • 100% correct • target ${fmtSec(target)}</p>${reason?`<div class="lock-reason">${esc(reason)}</div>`:''}</div><div class="result"><div class="best">${status}</div><div class="target">${best!=null?'Best perfect: '+fmtSec(best):x.attempts?`Last: ${x.lastCorrect}/${l.count} in ${fmtSec(x.lastSec)}`:'Not attempted'}</div>${unlocked?`<button class="cta secondary small" data-start-fluency="${l.id}" style="margin-top:7px">${x.mastered?'Repeat':'Start'}</button>`:''}</div></div>`}

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1}
function fmt(n){if(Number.isInteger(n))return String(n);return String(Math.round(n*1000)/1000)}
function today(){return new Date().toLocaleDateString('en-CA')}
function daysAgo(ts){return ts?Math.floor((Date.now()-ts)/DAY):9999}

function status(id){const x=skillState(id);if(!isUnlocked(BY_ID[id]))return['Locked','lock'];if(strong(id))return['Strong','good'];if(x.attempts===0)return['Not checked','lock'];if(x.mastery>=55)return['Developing','warn'];return['Needs practice','bad']}

function parseNumber(raw){const s=String(raw).trim().replace(/,/g,'').replace(/£/g,'').replace(/%/g,'');if(/^[-+]?\d+\s*\/\s*[-+]?\d+$/.test(s)){const[a,b]=s.split('/').map(Number);return b? a/b:NaN}return Number(s)}
function normText(s){return String(s).toLowerCase().replace(/\s+/g,'').replace(/[×x]/g,'*').replace(/−/g,'-')}
function isCorrect(raw,q){
 if(raw===undefined||raw===null||String(raw).trim()==='')return false;
 if(q.accept){const n=normText(raw);if(q.accept.some(a=>normText(a)===n))return true}
 if(typeof q.answer==='number'){const n=parseNumber(raw);return Number.isFinite(n)&&Math.abs(n-q.answer)<(q.tolerance||0.011)}
 return normText(raw)===normText(q.answer);
}
function Q(prompt,answer,opts={}){return{prompt,answer,display:opts.display??String(answer),choices:opts.choices||null,accept:opts.accept||null,hint:opts.hint||'',words:opts.words||false,tolerance:opts.tolerance||0,skill:opts.skill||null}}

function makeQuestion(id){const s=BY_ID[id];if(!s)return Q('2 + 2',4,{skill:id});const p=s.params||{};let q;
 switch(s.gen){
  case'count':{let a=rand(0,p.max-1);q=Q(`${a}, ${a+1}, ${a+2}, ?`,a+3);break}
  case'compare':{let a=rand(0,p.max),b=rand(0,p.max);while(a===b)b=rand(0,p.max);q=Q(`Which is larger: ${a} or ${b}?`,Math.max(a,b),{words:true});break}
  case'bond':{let a=rand(0,p.total);q=Q(`${a} + ? = ${p.total}`,p.total-a);break}
  case'add':{let a=rand(p.minA||0,p.max),b=rand(0,Math.max(1,p.max-a));q=Q(`${a} + ${b}`,a+b);break}
  case'sub':{let a=rand(p.minA||1,p.max),b=rand(0,a);q=Q(`${a} − ${b}`,a-b);break}
  case'double':{let a=rand(1,p.max);q=Q(`Double ${a}`,2*a,{words:true});break}
  case'half':{let a=2*rand(1,Math.floor(p.max/2));q=Q(`Half of ${a}`,a/2,{words:true});break}
  case'sequence':{let step=rand(1,p.stepMax||5),a=rand(0,Math.max(1,p.max-step*4));q=Q(`${a}, ${a+step}, ${a+2*step}, ${a+3*step}, ?`,a+4*step);break}
  case'shape2d':{let options=[['triangle',3],['square',4],['pentagon',5],['hexagon',6]];let [name,sides]=pick(options);q=Q(`How many sides does a ${name} have?`,sides,{words:true});break}
  case'place':{
   // Pick a non-zero digit that appears only once in the number. This avoids ambiguous
   // prompts such as "What is the value of the 1 in 11?", where either 1 or 10 could be meant.
   let n,chars,candidates=[],tries=0;
   do{
    n=rand(Math.min(10,p.max),p.max);chars=String(n).split('');
    candidates=chars.map((ch,pos)=>({ch,pos})).filter(x=>x.ch!=='0'&&chars.filter(c=>c===x.ch).length===1);
    tries++;
   }while(!candidates.length&&tries<40);
   if(!candidates.length){
    // Extremely defensive fallback: name the place explicitly if a unique digit was not found.
    const pos=0,pow=chars.length-1-pos,digit=Number(chars[pos]);
    const placeName=pow===0?'ones':pow===1?'tens':pow===2?'hundreds':pow===3?'thousands':`${10**pow}s`;
    q=Q(`What is the value of the ${digit} in the ${placeName} place of ${n}?`,digit*(10**pow),{words:true});
   }else{
    const chosen=pick(candidates),pow=chars.length-1-chosen.pos,digit=Number(chosen.ch),place=10**pow;
    q=Q(`What is the value of the ${digit} in ${n}?`,digit*place,{words:true});
   }
   break
  }
  case'timesFact':{let b=rand(1,12);q=Q(`${p.table} × ${b}`,p.table*b);break}

  case'fractionOf':{let d=pick(p.denoms),unit=rand(1,Math.max(2,Math.floor(p.max/d))),amount=unit*d,num=rand(1,d-1);let ans=amount*num/d;q=Q(`${num}/${d} of ${amount}`,ans);break}
  case'money':{let a=rand(5,p.maxP-10),b=rand(1,p.maxP-a);q=Q(`${a}p + ${b}p`,a+b,{display:`${a+b}p`});break}
  case'timeBasic':{let hour=rand(1,12),type=pick([['half past',30],['quarter past',15],['quarter to',45]]);let h=type[0]==='quarter to'?(hour%12)+1:hour;q=Q(`${type[0]} ${hour}`,`${h}:${String(type[1]).padStart(2,'0')}`,{words:true,accept:[`${h}:${String(type[1]).padStart(2,'0')}`,`${h}.${String(type[1]).padStart(2,'0')}`]});break}
  case'unitChoice':{let x=pick([{o:'length of a pencil',a:'cm',c:['cm','m','km','kg']},{o:'distance between cities',a:'km',c:['mm','cm','m','km']},{o:'mass of an apple',a:'g',c:['g','kg','ml','km']},{o:'water in a bottle',a:'ml',c:['g','kg','ml','km']}]);q=Q(`Best unit for the ${x.o}?`,x.a,{words:true,choices:shuffle(x.c)});break}
  case'wordAddSub':{let a=rand(10,p.max-20),b=rand(5,Math.min(30,p.max-a));if(Math.random()<.5)q=Q(`Mia has ${a} stickers and gets ${b} more. How many now?`,a+b,{words:true});else q=Q(`Mia has ${a+b} stickers and gives away ${b}. How many are left?`,a,{words:true});break}
  case'round':{let place=pick(p.places),n=rand(1,p.max);q=Q(`Round ${n} to the nearest ${place}`,Math.round(n/place)*place,{words:true});break}
  case'addSubMixed':{let a=rand(100,p.max),b=rand(50,Math.min(a,p.max));q=Math.random()<.5?Q(`${a} + ${b}`,a+b):Q(`${a} − ${b}`,a-b);break}
  case'multiply':{let a=rand(12,p.aMax),b=rand(2,p.bMax);q=Q(`${a} × ${b}`,a*b);break}

  case'fractionEquivalent':{let d=pick([2,3,4,5,6,8,10]),n=rand(1,d-1),m=pick([2,3,4]);q=Q(`${n}/${d} = ?/${d*m}`,n*m);break}

  case'wordMulti':{let packs=rand(3,9),each=rand(4,12),used=rand(2,Math.min(15,packs*each-1));q=Q(`${packs} packs contain ${each} pencils each. ${used} are used. How many remain?`,packs*each-used,{words:true});break}

function updateMastery(id,correct,ms){
 const x=skillState(id),s=BY_ID[id];x.attempts++;state.totalQuestions++;if(correct){x.correct++;state.totalCorrect++;x.streak++;state.stars+=2;if(ms&&ms<s.targetMs){x.fastCorrect++;state.stars++;}}else{x.streak=0}
 if(ms){x.avgMs=x.avgMs?Math.round(x.avgMs*.75+ms*.25):ms}
 const before=x.mastery;let delta=correct?(x.attempts<4?12:7):(x.attempts<4?-8:-5);if(correct&&ms&&ms<s.targetMs)delta+=2;if(correct&&x.streak>=3)delta+=2;x.mastery=clamp(Math.round(x.mastery+delta),0,100);x.lastSeen=Date.now();
 const intervals=x.mastery<40?0:x.mastery<60?1:x.mastery<75?3:x.mastery<90?7:21;x.nextReview=Date.now()+intervals*DAY;state.skills[id]=x;
 if(!strong(id)&&before<80&&x.mastery>=80&&x.attempts>=5)toast(`🌟 ${s.name} is getting strong!`);save();
}
function updatePracticeStreak(){const t=today(),last=state.lastPracticeDate;if(last===t)return;const y=new Date();y.setDate(y.getDate()-1);const yk=y.toLocaleDateString('en-CA');state.streak=last===yk?state.streak+1:1;state.lastPracticeDate=t;save()}
function logSession(type,items,durationSec,extra={}){const correct=items.filter(i=>i.correct).length;state.sessions.unshift({date:new Date().toISOString(),type,questions:items.length,correct,durationSec,...extra});state.sessions=state.sessions.slice(0,60);updatePracticeStreak();save()}
function weakestSkills(n=4,maxLevel=null){let maxIdx=maxLevel?levelIndex(maxLevel):Math.min(4,stageIndex()+1);return SKILLS.filter(s=>levelIndex(s.level)<=maxIdx&&isUnlocked(s)).sort((a,b)=>{const A=skillState(a.id),B=skillState(b.id);const aNew=A.attempts===0?25:0,bNew=B.attempts===0?25:0;return(A.mastery+aNew)-(B.mastery+bNew)}).slice(0,n)}
function dueSkills(n=8){return SKILLS.filter(s=>isUnlocked(s)&&due(s.id)).sort((a,b)=>skillState(a.id).nextReview-skillState(b.id).nextReview).slice(0,n)}
function confidenceSkills(n=5){return SKILLS.filter(s=>isUnlocked(s)&&skillState(s.id).attempts>0&&skillState(s.id).mastery>=60).sort(()=>Math.random()-.5).slice(0,n)}
function recommendedSkill(){return weakestSkills(1)[0]||SKILLS[0]}

function diagnosticSkills(){
 const lvl=currentStageLevel(),idx=levelIndex(lvl);let levels=LEVELS.filter((l,i)=>i<=Math.min(4,idx+1)&&i>=Math.max(0,idx-1)).map(l=>l.id);
 let anchors={
  early:['count20','compare20','bonds5','bonds10','add10','sub10','patterns','shape2d'],
  first:['bonds10','add10','sub10','count100','place100','bonds20','add20','sub20','double20','half20','add100','sub100','times2','times5','times10','fractionsBasic','money100','firstProblems'],
  second:['place100','add100','sub100','times2','times5','times10','place10000','rounding10_100','add10000','times3','times4','times6','times7','times8','times9','division12','fracEquivalent','fracOfAmount','decimalPlace','percentSimple','areaRect','secondProblems'],
  third:['times7','times8','division12','fractionOps','decimalOps','percentChange','ratioProp','integerOps','bodmas','algebraSimplify','algebraSub','linear1','linear2','gradientBasic','pythagoras','statsCompare','trigRight'],
  nat5:['integerOps','fractionOps','percentChange','algebraSimplify','linear2','gradientBasic','pythagoras','trigRight','n5Indices','n5SigFig','n5ReversePct','n5Expand','n5Factor','n5Straight','n5Quadratic','n5ArcSector','n5Stats']
 };
 return anchors[lvl]||anchors.first;
}
function seedDiagnostic(id,correct,ms){const x=skillState(id);x.attempts++;state.totalQuestions++;if(correct){x.correct++;state.totalCorrect++;x.mastery=Math.max(x.mastery,ms<BY_ID[id].targetMs?68:60);x.fastCorrect+=ms<BY_ID[id].targetMs?1:0}else{x.mastery=Math.min(x.mastery||100,24)}x.avgMs=ms;x.lastSeen=Date.now();x.nextReview=Date.now()+(correct?DAY:0);state.skills[id]=x;save()}

function makeDailyQueue(count=15){const focus=weakestSkills(3),review=dueSkills(6),easy=confidenceSkills(4),out=[];while(out.length<count){let pool;if(out.length<3&&easy.length)pool=easy;else if(out.length<Math.ceil(count*.72)&&focus.length)pool=focus;else pool=review.length?review:focus.length?focus:SKILLS.filter(isUnlocked);const s=pick(pool);out.push(s.id)}return out}
function makeSkillQueue(id,count=12){return Array.from({length:count},()=>id)}
function makeMixedQueue(count=15){let pool=SKILLS.filter(s=>isUnlocked(s)&&skillState(s.id).attempts>0);if(!pool.length)pool=SKILLS.slice(0,8);return Array.from({length:count},()=>pick(pool).id)}
function makeNat5Queue(count=12){let pool=SKILLS.filter(s=>s.level==='nat5'&&(isUnlocked(s)||state.settings.parentUnlockNat5));return Array.from({length:count},()=>pick(pool.length?pool:SKILLS.filter(s=>s.level==='nat5')).id)}

function startDiagnostic(){let ids=diagnosticSkills();activeSession={type:'Diagnostic',queue:ids,index:0,items:[],started:Date.now(),q:null,qStarted:0,diagnostic:true};renderSessionQuestion()}
function startSession(type,queue,opts={}){activeSession={type,queue,index:0,items:[],started:Date.now(),q:null,qStarted:0,diagnostic:false,...opts};renderSessionQuestion()}
function renderSessionQuestion(){const a=activeSession;if(!a)return; if(a.index>=a.queue.length)return finishSession();const id=a.queue[a.index],q=makeQuestion(id);a.q=q;a.qStarted=Date.now();const pct=Math.round(a.index/a.queue.length*100),s=BY_ID[id];let input=q.choices?`<div class="mcq">${q.choices.map(c=>`<button data-answer="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:`<div class="answer-row"><input id="answer" autocomplete="off" inputmode="decimal" aria-label="Answer"><button class="cta" id="check">Answer</button></div>`;
 render(`<div class="question-wrap"><div class="session-top"><button class="back no-print" id="quit">← Exit</button><div class="progress"><span style="width:${pct}%"></span></div><div class="timer">${a.index+1}/${a.queue.length}</div></div><section class="card qcard"><div class="qmeta">${a.diagnostic?'Starting-point check':esc(s.name)}</div><div class="qprompt ${q.words?'words':''}">${esc(q.prompt)}</div>${input}<div class="feedback" id="feedback"></div><div class="hint">${a.diagnostic?'Have a go. Not knowing is useful information.':q.hint||'Take your time first. Speed comes after understanding.'}</div><div class="streakline"><span>⭐ ${state.stars}</span><span>${a.diagnostic?'No score shown':`Skill ${skillState(id).mastery}%`}</span></div></section></div>`,'practice');
 document.getElementById('quit').onclick=()=>{if(confirm('Exit this session? Progress from answered questions is already saved.'))route('practice')};if(q.choices)document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submitAnswer(b.dataset.answer));else{const inp=document.getElementById('answer');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')submitAnswer(inp.value)};document.getElementById('check').onclick=()=>submitAnswer(inp.value)}
}
function submitAnswer(raw){const a=activeSession,q=a.q;if(!q)return;const ms=Date.now()-a.qStarted,ok=isCorrect(raw,q);if(a.diagnostic)seedDiagnostic(q.skill,ok,ms);else updateMastery(q.skill,ok,ms);a.items.push({skill:q.skill,correct:ok,ms,prompt:q.prompt,answer:q.display,raw});const fb=document.getElementById('feedback');fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?pick(['✓ Nice one!','✓ Correct!','✓ Great work!']):`Not this time — answer: ${q.display}`;document.querySelectorAll('.mcq button,#check,#answer').forEach(el=>el.disabled=true);setTimeout(()=>{a.index++;renderSessionQuestion()},ok?550:1050)}
function finishSession(){const a=activeSession;if(!a)return;const duration=Math.round((Date.now()-a.started)/1000),correct=a.items.filter(i=>i.correct).length;if(a.diagnostic){state.diagnosticDone=true;state.sessions.unshift({date:new Date().toISOString(),type:'Diagnostic',questions:a.items.length,correct,durationSec:duration});save();activeSession=null;const focus=weakestSkills(3);render(`<section class="card complete"><div class="score">Ready</div><h1>We found a starting point.</h1><p class="muted">There is no school-year grade here. The first mission will start with ${esc(focus[0]?.name||'number foundations')} and mix in easier successes.</p><button class="cta" id="go">See my maths path →</button></section>`,'home');document.getElementById('go').onclick=renderHome;return}
 logSession(a.type,a.items,duration,{skill:a.fixedSkill||null});activeSession=null;const pct=Math.round(correct/Math.max(1,a.items.length)*100);render(`<section class="card complete"><div class="score">${pct}%</div><h1>${pct>=80?'Brilliant work!':pct>=60?'Good practice!':'Useful practice!'}</h1><p class="muted">${correct} of ${a.items.length} correct in ${Math.max(1,Math.round(duration/60))} min. Mistakes are fed back into future practice automatically.</p><div class="button-row" style="justify-content:center"><button class="cta" id="home">Home</button><button class="cta secondary" id="again">Practise again</button></div></section>`,'practice');document.getElementById('home').onclick=renderHome;document.getElementById('again').onclick=renderPractice}

function renderPractice(){
 const r=recommendedSkill();render(`<div class="section-head"><div><h2>Choose today’s practice</h2><p>Short sessions. One clear purpose each time.</p></div></div><div class="mode-grid">
 <button class="mode" id="dailyMode"><div class="ico">🎯</div><h3>Daily Mission</h3><p>${state.settings.dailyQuestions} adaptive questions: confidence, current focus and spaced review.</p></button>
 <button class="mode" id="beatMode"><div class="ico">⚡</div><h3>Fluency Mastery</h3><p>Kumon-style timed sets. 100% correct and Standard Mastery Time required before the next level unlocks.</p></button>

 <div class="section-head"><h2>Recommended next</h2></div><section class="card"><h3 style="margin-top:0">${esc(r.name)}</h3><p class="muted">${skillWhy(r)}</p><div class="button-row"><button class="cta" id="rec">Practise this skill</button><button class="cta secondary" id="pathBtn">See all skills</button></div></section>`,'practice');
 document.getElementById('dailyMode').onclick=()=>startSession('Daily Mission',makeDailyQueue(state.settings.dailyQuestions));document.getElementById('beatMode').onclick=()=>renderFluency('add');document.getElementById('skillMode').onclick=renderSkillPicker;document.getElementById('mixedMode').onclick=()=>startSession('Mixed Review',makeMixedQueue(state.settings.dailyQuestions));document.getElementById('rec').onclick=()=>startSession('Skill Practice',makeSkillQueue(r.id,12),{fixedSkill:r.id});document.getElementById('pathBtn').onclick=renderPath;
}
function skillWhy(s){const map={
 'Mental fluency':'Fast recall frees up attention for harder problems later.',
 'Times tables':'Automatic multiplication facts support division, fractions, ratio and algebra.',
 'Fractions':'Fractions underpin decimals, percentages, ratio and much later algebra.',
 'Algebra':'Algebra builds the symbolic reasoning needed throughout secondary mathematics.',
 'Geometry':'Shape and measurement skills grow into Pythagoras, trigonometry and National 5 geometry.',
 'Trigonometry':'Trigonometry connects angles, lengths, graphs and later National 5 problem-solving.',
 'Statistics':'Data skills develop comparison, interpretation and mathematical reasoning.',
 'Reasoning':'Word problems practise choosing the operation, not just carrying it out.'};return map[s.strand]||'This is a useful prerequisite for the next part of the maths pathway.'}
function renderSkillPicker(){const eligible=SKILLS.filter(s=>isUnlocked(s)&&levelIndex(s.level)<=Math.min(4,stageIndex()+1));render(`<div class="section-head"><div><h2>Practise one skill</h2><p>Choose anything currently unlocked.</p></div></div><section class="card"><div class="skill-chip-grid">${eligible.map(s=>skillChip(s,true)).join('')}</div></section>`,'practice');document.querySelectorAll('[data-skill-practice]').forEach(b=>b.onclick=()=>{let id=b.dataset.skillPractice;startSession('Skill Practice',makeSkillQueue(id,12),{fixedSkill:id})})}
function skillChip(s,clickable=false){const x=skillState(s.id),lock=!isUnlocked(s);return `<button class="skill-chip ${lock?'locked':''}" ${clickable&&!lock?`data-skill-practice="${s.id}"`:''} ${lock?'disabled':''}><strong>${esc(s.name)}</strong><small>${x.attempts?`${accuracy(s.id)}% accuracy • ${x.mastery}% mastery`:'Not practised yet'}</small><div class="mini"><span style="width:${x.mastery}%"></span></div></button>`}

function renderBeatSelect(){let candidates=SKILLS.filter(s=>MENTAL_IDS.includes(s.id)&&isUnlocked(s)&&levelIndex(s.level)<=Math.min(4,stageIndex()+1));if(!candidates.length)candidates=SKILLS.filter(s=>['bonds5','bonds10','add10'].includes(s.id));let rec=candidates.sort((a,b)=>skillState(a.id).mastery-skillState(b.id).mastery).slice(0,12);render(`<section class="card"><div class="pill">⚡ 60-second fluency</div><h1 style="font-size:38px;margin-top:0">Beat Your Best</h1><p class="muted">Choose a mental-maths skill. Correct answers count; mistakes simply come back another day.</p><div class="skill-chip-grid">${rec.map(s=>`<button class="skill-chip" data-beat="${s.id}"><strong>${esc(s.name)}</strong><small>Best: ${state.beatBest[s.id]||0} correct</small><div class="mini"><span style="width:${skillState(s.id).mastery}%"></span></div></button>`).join('')}</div><div class="divider"></div><button class="cta secondary" id="mixedBeat">Mixed fluency • Best ${state.beatBest.mixed||0}</button></section>`,'practice');document.querySelectorAll('[data-beat]').forEach(b=>b.onclick=()=>startBeat(b.dataset.beat));document.getElementById('mixedBeat').onclick=()=>startBeat('mixed')}
function startBeat(id){clearInterval(beatTimer);const pool=id==='mixed'?SKILLS.filter(s=>MENTAL_IDS.includes(s.id)&&isUnlocked(s)&&levelIndex(s.level)<=Math.min(4,stageIndex()+1)).map(s=>s.id):[id];activeSession={type:'Beat Your Best',beat:true,fixedSkill:id,pool:pool.length?pool:['bonds10'],items:[],started:Date.now(),endAt:Date.now()+60000,q:null,qStarted:Date.now(),ending:false};beatTimer=setInterval(()=>{let left=Math.max(0,Math.ceil((activeSession?.endAt-Date.now())/1000));const el=document.getElementById('beatClock');if(el)el.textContent=`${left}s`;if(left<=0)finishBeat()},200);renderBeatQuestion()}
function renderBeatQuestion(){const a=activeSession;if(!a||a.ending)return;const id=pick(a.pool),q=makeQuestion(id);a.q=q;a.qStarted=Date.now();let input=q.choices?`<div class="mcq">${q.choices.map(c=>`<button data-banswer="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:`<div class="answer-row"><input id="banswer" autocomplete="off" inputmode="decimal"><button class="cta" id="bcheck">Answer</button></div>`;render(`<div class="question-wrap"><div class="session-top"><button class="back" id="beatExit">← Exit</button><div class="progress"><span style="width:${Math.min(100,a.items.length*4)}%"></span></div><div class="timer" id="beatClock">${Math.max(0,Math.ceil((a.endAt-Date.now())/1000))}s</div></div><section class="card qcard"><div class="qmeta">⚡ Beat Your Best • ${esc(BY_ID[id].name)}</div><div class="qprompt ${q.words?'words':''}">${esc(q.prompt)}</div>${input}<div class="feedback" id="feedback"></div><div class="streakline"><span>Correct: ${a.items.filter(i=>i.correct).length}</span><span>Best: ${state.beatBest[a.fixedSkill]||0}</span></div></section></div>`,'practice');document.getElementById('beatExit').onclick=finishBeat;if(q.choices)document.querySelectorAll('[data-banswer]').forEach(b=>b.onclick=()=>submitBeat(b.dataset.banswer));else{const inp=document.getElementById('banswer');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')submitBeat(inp.value)};document.getElementById('bcheck').onclick=()=>submitBeat(inp.value)}}
function submitBeat(raw){const a=activeSession;if(!a||a.ending)return;if(Date.now()>=a.endAt)return finishBeat();const q=a.q,ms=Date.now()-a.qStarted,ok=isCorrect(raw,q);updateMastery(q.skill,ok,ms);a.items.push({skill:q.skill,correct:ok,ms,prompt:q.prompt,answer:q.display,raw});if(ok){renderBeatQuestion()}else{const fb=document.getElementById('feedback');if(fb){fb.className='feedback no';fb.textContent=`Answer: ${q.display}`;document.querySelectorAll('#bcheck,#banswer,.mcq button').forEach(x=>x.disabled=true);setTimeout(()=>renderBeatQuestion(),600)}}}
function finishBeat(){const a=activeSession;if(!a||!a.beat||a.ending)return;a.ending=true;clearInterval(beatTimer);beatTimer=null;const score=a.items.filter(i=>i.correct).length,before=state.beatBest[a.fixedSkill]||0,newBest=score>before;if(newBest)state.beatBest[a.fixedSkill]=score;logSession('Beat Your Best',a.items,60,{skill:a.fixedSkill,score});activeSession=null;render(`<section class="card complete"><div class="score">${score}</div><h1>${newBest?'New best! 🎉':'Fluency practice complete'}</h1><p class="muted">${newBest?`Your previous best was ${before}.`: `Your best is ${before}.`} The aim is your own improvement, not somebody else’s speed.</p><div class="button-row" style="justify-content:center"><button class="cta" id="beatAgain">Try again</button><button class="cta secondary" id="beatHome">Practice menu</button></div></section>`,'practice');document.getElementById('beatAgain').onclick=renderBeatSelect;document.getElementById('beatHome').onclick=renderPractice}

function renderPath(){const childMax=Math.min(4,stageIndex()+1);render(`<div class="section-head"><div><h2>The maths pathway</h2><p>Skills unlock through prerequisites, not birthdays.</p></div></div><div class="callout"><strong>For ${esc(state.profile.name)}</strong><div class="note">The learner only needs to think about the next few skills. Later levels are shown here so a parent can see where today’s foundations eventually lead.</div></div><div class="path" style="margin-top:14px">${LEVELS.map((l,i)=>levelBlock(l,i>childMax)).join('')}</div>`,'path');document.querySelectorAll('[data-practise-path]').forEach(b=>b.onclick=()=>{const id=b.dataset.practisePath;if(isUnlocked(BY_ID[id]))startSession('Skill Practice',makeSkillQueue(id,12),{fixedSkill:id})})}
function levelBlock(l,future){const skills=SKILLS.filter(s=>s.level===l.id),strands=[...new Set(skills.map(s=>s.strand))];return `<details class="level-card" ${future?'':'open'}><summary class="level-head"><div><strong>${l.name}</strong><small>${l.stage} • ${skills.length} mapped skills</small></div><div style="min-width:150px"><div class="progress"><span style="width:${levelProgress(l.id)}%"></span></div><small>${levelProgress(l.id)}% pathway strength</small></div></summary><div class="level-body">${strands.map(str=>`<div class="strand-title">${esc(str)}</div><div class="skill-chip-grid">${skills.filter(s=>s.strand===str).map(s=>{const x=skillState(s.id),lock=!isUnlocked(s);return `<button class="skill-chip ${lock?'locked':''}" data-practise-path="${s.id}" ${lock?'disabled':''}><strong>${lock?'🔒 ':''}${esc(s.name)}</strong><small>${x.attempts?`${x.mastery}% mastery • ${accuracy(s.id)}% accuracy`:future?'Future pathway':'Ready when prerequisites are secure'}</small><div class="mini"><span style="width:${x.mastery}%"></span></div></button>`}).join('')}</div>`).join('')}</div></details>`}

function renderParent(tab=activeParentTab){activeParentTab=tab;const tabs=`<div class="tabs no-print"><button data-ptab="overview" class="${tab==='overview'?'active':''}">Overview</button><button data-ptab="fluency" class="${tab==='fluency'?'active':''}">Fluency & speed</button><button data-ptab="skills" class="${tab==='skills'?'active':''}">All skills</button><button data-ptab="sessions" class="${tab==='sessions'?'active':''}">Sessions</button><button data-ptab="worksheet" class="${tab==='worksheet'?'active':''}">Worksheet</button><button data-ptab="settings" class="${tab==='settings'?'active':''}">Settings & data</button></div>`;let body=tab==='overview'?parentOverview():tab==='fluency'?parentFluency():tab==='skills'?parentSkills():tab==='sessions'?parentSessions():tab==='worksheet'?parentWorksheet():parentSettings();render(`${tabs}${body}`,'parent');document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>renderParent(b.dataset.ptab));bindParentActions(tab)}
function parentOverview(){const acc=state.totalQuestions?Math.round(state.totalCorrect/state.totalQuestions*100):0,focus=weakestSkills(4),work=LEVELS.find(l=>l.id===workingLevel());let last7=state.sessions.filter(s=>Date.now()-new Date(s.date).getTime()<7*DAY),q7=last7.reduce((a,s)=>a+s.questions,0);return `<section class="card parent-hero"><div class="grid"><div class="span8"><div class="pill">Parent dashboard</div><h1 style="font-size:42px;margin:0 0 12px">${esc(state.profile.name)}’s maths picture</h1><p>School stage: ${esc(state.profile.stage)}. Current focus zone: <strong>${work?.name||'Foundations'}</strong>. This is a learning estimate, not a school grade or National 5 prediction.</p></div><div class="span4"><div class="stat"><div class="label" style="color:#cbd3e8">THIS WEEK</div><div class="value">${q7}</div><div class="sub" style="color:#cbd3e8">questions completed</div></div></div></div></section>
 <div class="section-head"><h2>At a glance</h2><button class="cta secondary small no-print" id="printReport">Print report</button></div><div class="grid"><section class="card stat span3"><div class="label">ACCURACY</div><div class="value">${acc}%</div><div class="sub">Across all practice</div></section><section class="card stat span3"><div class="label">STRONG SKILLS</div><div class="value">${strongCount()}</div><div class="sub">Repeatedly demonstrated</div></section><section class="card stat span3"><div class="label">STREAK</div><div class="value">${state.streak}</div><div class="sub">Consecutive practice days</div></section><section class="card stat span3"><div class="label">QUESTIONS</div><div class="value">${state.totalQuestions}</div><div class="sub">Diagnostic + practice</div></section></div>

 <div class="section-head"><h2>What to work on</h2><p>The system prioritises prerequisite gaps.</p></div><div class="grid"><section class="card span7">${focus.map(skillRow).join('')}</section><section class="card span5"><div class="recommend"><strong>Recommended routine</strong><span class="tiny">${state.settings.dailyQuestions} questions, around 5 days each week. Stop while confidence is still good rather than stretching a session too long.</span></div><div class="divider"></div><strong>Current first priority</strong><p class="muted">${esc(focus[0]?.name||'Number foundations')}</p><p class="note">${focus[0]?skillWhy(focus[0]):''}</p></section></div>

 <div class="section-head"><h2>Recent learning</h2></div><section class="card">${state.sessions.length?state.sessions.slice(0,5).map(sessionLine).join(''):'<p class="muted">No completed sessions yet.</p>'}</section>`}
function parentSkills(){return `<div class="section-head"><div><h2>All mapped skills</h2><p>Mastery uses repeated accuracy, not a one-question tick.</p></div></div>${LEVELS.map(l=>`<section class="card" style="margin-bottom:14px"><h3>${l.name} <span class="tiny">${l.stage}</span></h3>${SKILLS.filter(s=>s.level===l.id).map(skillRow).join('')}</section>`).join('')}`}

function importLegacyV3(){let x;try{x=JSON.parse(localStorage.getItem(V3_LEGACY_STORE)||'null')}catch(e){}if(!x?.profile)return;const f=activeFamilyV3();if(!f){alert('Create or log in to a parent account first, then import the V2 learner from Family.');return}const id=uid('child');platformV3.children[id]={id,familyId:f.id,leaderboardAlias:randomAlias(),leaderboardOptIn:false,progress:normaliseProgressV3(x),createdAt:new Date().toISOString()};platformV3.activeChildId=id;setCurrentChildStateV3();persistPlatformV3();renderHome()}

function renderFamilyV3(){const f=activeFamilyV3();if(!f)return renderGatewayV3();const kids=familyChildrenV3();bareV3(`<section class="card owner-banner"><div class="grid"><div class="span8"><div class="pill">Parent account • Free founding access</div><h1 style="font-size:40px;margin:0 0 8px">${esc(f.parentName)}’s family</h1><p class="muted">Add up to ${f.maxChildren} children. Each child keeps an independent, permanent progress record.</p></div><div class="span4"><button class="cta secondary" id="logoutFam">Log out</button></div></div></section><div class="section-head"><div><h2>Children</h2><p>${kids.length}/${f.maxChildren} profiles</p></div>${kids.length<f.maxChildren?'<button class="cta" id="addChild">+ Add child</button>':''}</div>${kids.length?`<div class="family-grid">${kids.map(c=>{const p=c.progress||{};const mastered=Object.values(p.fluency?.levels||{}).filter(x=>x.mastered).length;return`<section class="card child-card"><div class="avatar">${['🌟','🚀','🦊','🐼','🪐'][Math.abs(c.id.length)%5]}</div><h3 style="margin:0">${esc(p.profile?.name||'Learner')}</h3><p class="tiny">${esc(p.profile?.stage||'')} • ${mastered} fluency levels mastered</p><div class="privacy-pill ${c.leaderboardOptIn?'':'off'}">${c.leaderboardOptIn?'🏆 '+esc(c.leaderboardAlias):'🔒 Not on leaderboard'}</div><div class="divider"></div><button class="cta small" data-open-child="${c.id}">Open learner</button><button class="cta secondary small" data-child-privacy="${c.id}" style="margin-left:5px">Leaderboard settings</button></section>`}).join('')}</div>`:'<section class="card empty"><h2>No children yet</h2><p>Add the first learner profile. School stage guides the diagnostic, but does not force the child to work at that level.</p><button class="cta" id="addFirst">Add first child →</button></section>'}<div class="section-head"><h2>Account</h2></div><section class="card"><div class="grid"><div class="span6"><strong>${esc(f.email)}</strong><p class="tiny">Plan: Free family access • invitation code ${esc(platformV3.codes[f.inviteCodeId]?.code||'Imported')}</p></div><div class="span6"><div class="button-row"><button class="cta secondary small" id="familyLeaderboard">View family leaderboards</button>${safeLegacyExistsV3()?'<button class="cta secondary small" id="legacyFromFamily">Import V2 progress</button>':''}</div></div></div></section>`);
 document.getElementById('logoutFam').onclick=logoutFamilyV3;document.querySelectorAll('#addChild,#addFirst').forEach(a=>a.onclick=renderAddChildV3);document.querySelectorAll('[data-open-child]').forEach(b=>b.onclick=()=>switchChildV3(b.dataset.openChild));document.querySelectorAll('[data-child-privacy]').forEach(b=>b.onclick=()=>renderChildPrivacyV3(b.dataset.childPrivacy));document.getElementById('familyLeaderboard').onclick=()=>{const k=familyChildrenV3()[0];if(k){switchChildV3(k.id);renderLeaderboardsV3()}else alert('Add a child first.')};const lg=document.getElementById('legacyFromFamily');if(lg)lg.onclick=importLegacyV3
}
function renderAddChildV3(){const f=activeFamilyV3();if(!f)return renderGatewayV3();if(familyChildrenV3().length>=f.maxChildren)return alert('This family code has reached its child-profile limit.');bareV3(`<section class="card setup"><div class="pill">🌱 New learner</div><h1>Add a child.</h1><p class="muted">Their real first name is only used inside the family account. The public leaderboard uses a separate nickname.</p><div class="field-inline"><div class="field"><label>First name or home nickname</label><input id="childName" maxlength="24"></div><div class="field"><label>School stage</label><select id="childStage">${['P1','P2','P3','P4','P5','P6','P7','S1','S2','S3','S4','S5','S6'].map(x=>`<option ${x==='P4'?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Leaderboard nickname</label><input id="childAlias" maxlength="24" value="${randomAlias()}"><p class="note">Avoid surnames, school names or anything that identifies the child.</p></div><div class="field"><label class="switchline"><input id="childOpt" type="checkbox"> Publish this nickname and mastered times on friend leaderboards</label></div><div class="button-row"><button class="cta" id="saveChild">Create learner →</button><button class="cta secondary" id="cancelChild">Cancel</button></div></section>`);document.getElementById('cancelChild').onclick=renderFamilyV3;document.getElementById('saveChild').onclick=()=>{const name=document.getElementById('childName').value.trim()||'Learner',stage=document.getElementById('childStage').value,alias=document.getElementById('childAlias').value.trim()||randomAlias(),opt=document.getElementById('childOpt').checked,id=uid('child'),p=freshState();p.profile={name,stage,confidence:'not-sure',created:new Date().toISOString()};platformV3.children[id]={id,familyId:f.id,leaderboardAlias:alias,leaderboardOptIn:opt,progress:p,createdAt:new Date().toISOString()};platformV3.activeChildId=id;setCurrentChildStateV3();persistPlatformV3();renderHome()}}
function renderChildPrivacyV3(id){const c=platformV3.children[id];if(!c||c.familyId!==platformV3.activeFamilyId)return;bareV3(`<section class="card setup"><div class="pill">🏆 Leaderboard privacy</div><h1>${esc(c.progress?.profile?.name||'Learner')}</h1><p class="muted">Only the leaderboard nickname, mastery level and best mastered time are shared. The child’s real name, school stage, mistakes and practice history are not part of the leaderboard entry.</p><div class="field"><label>Leaderboard nickname</label><input id="privacyAlias" maxlength="24" value="${esc(c.leaderboardAlias||randomAlias())}"></div><div class="field"><label class="switchline"><input id="privacyOpt" type="checkbox" ${c.leaderboardOptIn?'checked':''}> Appear on leaderboards</label></div><div class="button-row"><button class="cta" id="savePrivacy">Save</button><button class="cta secondary" id="privacyBack">Back</button></div></section>`);document.getElementById('privacyBack').onclick=renderFamilyV3;document.getElementById('savePrivacy').onclick=()=>{c.leaderboardAlias=document.getElementById('privacyAlias').value.trim()||randomAlias();c.leaderboardOptIn=document.getElementById('privacyOpt').checked;persistPlatformV3();renderFamilyV3()}}

function leaderboardEntriesV3(levelId){const rows=[],level=effectiveFluencyV3(levelId),br=Number(level?.boardRevision)||1;for(const c of Object.values(platformV3.children)){if(!c.leaderboardOptIn)continue;const x=c.progress?.fluency?.levels?.[levelId],r=x?.boardResults?.[br];if(!r)continue;rows.push({childId:c.id,alias:c.leaderboardAlias||'Maths Star',sec:r.bestSec,masteredAt:r.achievedAt,courseVersion:r.courseVersion||1,boardRevision:br})}rows.sort((a,b)=>a.sec-b.sec||String(a.masteredAt).localeCompare(String(b.masteredAt)));return rows}
function renderLeaderboardsV3(op='add',focusId=null){if(!activeChildV3())return renderFamilyV3();const levels=courseLevelsV3(op);render(`<section class="card"><div class="section-head" style="margin-top:0"><div><div class="pill">🏆 Friendly fluency boards</div><h1 style="font-size:40px;margin:0">Mastery leaderboards</h1><p class="muted">Ranked by best 100%-correct time. Only opted-in leaderboard nicknames are shown.</p></div><span class="version-badge">Course v${currentCourseV3().version}</span></div><div class="op-tabs">${FLUENCY_OPERATIONS.map(o=>`<button class="op-tab ${op===o.id?'active':''}" data-board-op="${o.id}"><span class="opico">${o.icon}</span>${o.name}</button>`).join('')}</div></section><div class="leaderboard-grid" style="margin-top:14px">${levels.map(l=>leaderboardCardV3(l,focusId)).join('')}</div>`,'leaderboard');document.querySelectorAll('[data-board-op]').forEach(b=>b.onclick=()=>renderLeaderboardsV3(b.dataset.boardOp))}
function leaderboardCardV3(l,focusId){const rows=leaderboardEntriesV3(l.id),me=platformV3.activeChildId,meRank=rows.findIndex(r=>r.childId===me)+1;return`<section class="card leaderboard-card" ${focusId===l.id?'style="box-shadow:0 0 0 3px #d7d0ff,var(--shadow)"':''}><div class="leaderboard-head"><strong>${esc(l.name)}</strong><div class="tiny">${l.count} questions • ${fmtSec(l.targetSec)} target • board ${l.boardRevision}${meRank?` • your rank #${meRank}`:''}</div></div>${rows.length?rows.slice(0,10).map((r,i)=>`<div class="leader-row ${r.childId===me?'you':''}"><div class="rank">${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</div><div><strong>${esc(r.alias)}${r.childId===me?' (you)':''}</strong><div class="tiny">mastered • course v${r.courseVersion}</div></div><strong>${fmtSec(r.sec)}</strong></div>`).join(''):'<div class="empty">No published mastery times yet.</div>'}</section>`}

 const ch=activeChildV3(),f=activeFamilyV3(),has=!!ch&&!!state.profile;return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">∑</div><span>Nat5 Ready Maths</span></div><nav class="nav"><button data-nav="home" class="${active==='home'?'active':''} ${!has?'locked':''}">Home</button><button data-nav="fluency" class="${active==='fluency'?'active':''} ${!has?'locked':''}">⚡ Fluency</button><button data-nav="practice" class="${active==='practice'?'active':''} ${!has?'locked':''}">Practise</button><button data-nav="path" class="${active==='path'?'active':''} ${!has?'locked':''}">Maths path</button><button data-nav="leaderboard" class="${active==='leaderboard'?'active':''} ${!has?'locked':''}">🏆 Boards</button><button data-nav="parent" class="${active==='parent'?'active':''} ${!has?'locked':''}">Parent</button><button data-nav="family" class="${active==='family'?'active':''}">Family</button>${platformV3.ownerLocal?`<button data-nav="owner" class="${active==='owner'?'active':''}">Admin</button>`:''}</nav></header>${has?`<div class="child-switch no-print" style="margin:-5px 0 14px"><span class="top-chip">👤 ${esc(state.profile.name)} • ${esc(state.profile.stage)}</span>${familyChildrenV3().length>1?'<button class="linklike" id="quickSwitch">Switch child</button>':''}</div>`:''}${content}<div class="footer">Nat5 Ready Maths V${V3_VERSION} • learner records use stable IDs • published course v${currentCourseV3().version}</div></div>`

function ensureDraftV3(){if(!platformV3.courseDraft||platformV3.courseDraft.version!==platformV3.course.version)platformV3.courseDraft=deepClone(platformV3.course);return platformV3.courseDraft}
function renderOwnerV3(tab='codes'){platformV3.ownerLocal=true;persistPlatformV3();const tabs=`<div class="tabs"><button data-atab="codes" class="${tab==='codes'?'active':''}">Free codes</button><button data-atab="course" class="${tab==='course'?'active':''}">Course studio</button><button data-atab="versions" class="${tab==='versions'?'active':''}">Versions & records</button></div>`;let body=tab==='codes'?ownerCodesV3():tab==='course'?ownerCourseV3():ownerVersionsV3();render(`<section class="card owner-banner"><div class="grid"><div class="span8"><div class="pill">Owner tools • local prototype</div><h1 style="font-size:40px;margin:0 0 8px">Platform administration</h1><p class="muted">Issue free family codes, publish course changes and inspect version history without editing learner records.</p></div><div class="span4"><button class="cta secondary" id="leaveOwner">Parent gateway</button></div></div></section><div style="margin-top:14px">${tabs}${body}</div>`,'owner');document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>renderOwnerV3(b.dataset.atab));document.getElementById('leaveOwner').onclick=()=>{platformV3.ownerLocal=false;persistPlatformV3();activeFamilyV3()?renderFamilyV3():renderGatewayV3()};bindOwnerV3(tab)}
function ownerCodesV3(){const rows=Object.values(platformV3.codes).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));return`<div class="section-head"><div><h2>Free family access codes</h2><p>A code can have a use limit, child limit and optional expiry.</p></div><button class="cta" id="newCode">+ Create free code</button></div><section class="card"><div class="code-row" style="font-weight:900;color:var(--muted)"><span>CODE</span><span>LABEL</span><span>USES</span><span>CHILDREN</span><span>STATUS</span><span></span></div>${rows.length?rows.map(c=>`<div class="code-row"><strong>${esc(c.code)}</strong><span>${esc(c.label||'Friends & family')}</span><span>${c.uses||0}/${c.maxUses}</span><span>up to ${c.maxChildren}</span><span>${c.active?'✅ Active':'⛔ Off'}${c.expiresAt?`<br><small>${new Date(c.expiresAt).toLocaleDateString('en-GB')}</small>`:''}</span><span><button class="copy-btn" data-copy-code="${esc(c.code)}">Copy</button> <button class="copy-btn" data-toggle-code="${c.id}">${c.active?'Revoke':'Enable'}</button></span></div>`).join(''):'<div class="empty">No codes yet. Create one for a family friend.</div>'}</section><div class="cloud-note" style="margin-top:14px"><strong>Important for real sharing</strong><p class="note">This downloaded V3 proves the account/code workflow locally. A code created here exists only in this browser. The included Firebase backend contract is what turns these into real cross-device codes for family friends.</p></div>`}
function showCreateCodeV3(){render(`<section class="card setup"><div class="pill">🎟️ Free access</div><h1>Create family code</h1><div class="field"><label>Label / who it is for</label><input id="codeLabel" placeholder="e.g. Emma’s family"></div><div class="field-inline"><div class="field"><label>Number of families that can redeem it</label><input id="codeUses" type="number" min="1" max="100" value="1"></div><div class="field"><label>Children per family</label><input id="codeChildren" type="number" min="1" max="10" value="4"></div></div><div class="field"><label>Expiry (optional)</label><input id="codeExpiry" type="date"></div><div class="button-row"><button class="cta" id="createCodeNow">Generate code</button><button class="cta secondary" id="codeCancel">Cancel</button></div></section>`,'owner');document.getElementById('codeCancel').onclick=()=>renderOwnerV3('codes');document.getElementById('createCodeNow').onclick=()=>{const id=uid('code'),code=randomCode();platformV3.codes[id]={id,code,label:document.getElementById('codeLabel').value.trim()||'Friends & family',maxUses:Math.max(1,Number(document.getElementById('codeUses').value)||1),uses:0,maxChildren:Math.max(1,Number(document.getElementById('codeChildren').value)||4),expiresAt:document.getElementById('codeExpiry').value?new Date(document.getElementById('codeExpiry').value+'T23:59:59').toISOString():null,active:true,plan:'free',createdAt:new Date().toISOString()};persistPlatformV3();renderOwnerV3('codes');setTimeout(()=>alert(`Free code created: ${code}`),50)}}
function ownerCourseV3(){const d=ensureDraftV3();return`<div class="section-head"><div><h2>Course studio</h2><p>Edit the draft, then publish it as a new version. Learner records are not modified.</p></div><div><span class="version-badge">Published v${platformV3.course.version}</span> <span class="version-badge draft-badge">Draft</span></div></div><div class="schema-note"><strong>Stable-ID rule:</strong> a level’s ID (for example <code>add08</code>) is permanent. Rename, reorder, retime or archive the level, but do not reuse that ID for a different mathematical skill.</div>${FLUENCY_OPERATIONS.map(o=>{const rows=FLUENCY_LEVELS.filter(l=>l.op===o.id).map(l=>({...l,...(d.fluency[l.id]||{})})).sort((a,b)=>a.order-b.order);return`<section class="card" style="margin-top:14px"><h3>${o.icon} ${o.name}</h3><div style="overflow:auto"><div class="course-row" style="font-weight:900;color:var(--muted)"><span>ID</span><span>Name</span><span>Questions</span><span>SMT sec</span><span>Active</span><span>Order</span></div>${rows.map(l=>`<div class="course-row"><code>${l.id}</code><input type="text" data-course-name="${l.id}" value="${esc(l.name)}"><input type="number" min="5" max="100" data-course-count="${l.id}" value="${l.count}"><input type="number" min="10" max="600" data-course-target="${l.id}" value="${l.targetSec}"><label class="switchline"><input type="checkbox" data-course-active="${l.id}" ${l.active!==false?'checked':''}> ${l.active!==false?'Live':'Archived'}</label><div class="move"><button data-move-level="${l.id}" data-dir="-1">↑</button><button data-move-level="${l.id}" data-dir="1">↓</button></div></div>`).join('')}</div></section>`}).join('')}<div class="button-row" style="margin-top:14px"><button class="cta" id="publishCourse">Publish as v${platformV3.course.version+1}</button><button class="cta secondary" id="saveDraft">Save draft</button><button class="cta secondary" id="discardDraft">Discard draft</button></div>`}
function captureDraftV3(){const d=ensureDraftV3();document.querySelectorAll('[data-course-name]').forEach(i=>d.fluency[i.dataset.courseName].name=i.value.trim()||FLUENCY_BY_ID[i.dataset.courseName].name);document.querySelectorAll('[data-course-count]').forEach(i=>d.fluency[i.dataset.courseCount].count=Math.max(5,Number(i.value)||FLUENCY_BY_ID[i.dataset.courseCount].count));document.querySelectorAll('[data-course-target]').forEach(i=>d.fluency[i.dataset.courseTarget].targetSec=Math.max(10,Number(i.value)||FLUENCY_BY_ID[i.dataset.courseTarget].targetSec));document.querySelectorAll('[data-course-active]').forEach(i=>d.fluency[i.dataset.courseActive].active=i.checked);persistPlatformV3()}

async function cloudPublishCourseV5(){captureDraftV3();const previous=platformV3.course,next=deepClone(platformV3.courseDraft);for(const l of FLUENCY_LEVELS){const before=previous.fluency?.[l.id]||{},after=next.fluency?.[l.id]||{},oldRev=Number(before.boardRevision)||1;after.boardRevision=(Number(before.count)!==Number(after.count)||Number(before.targetSec)!==Number(after.targetSec))?oldRev+1:oldRev;next.fluency[l.id]=after}next.version=Number(platformV3.course.version||1)+1;next.publishedAt=new Date().toISOString();next.note='Published from Cloud Course Studio';const batch=cloudV5.mods.writeBatch(cloudV5.db);batch.set(cloudV5.mods.doc(cloudV5.db,'courses','current'),{course:next});batch.set(cloudV5.mods.doc(cloudV5.db,'courseVersions',`v${next.version}`),{course:next});batch.set(cloudV5.mods.doc(cloudV5.db,'courses','draft'),{course:next});await batch.commit();platformV3.course=next;platformV3.courseDraft=deepClone(next);platformV3.courseVersions.push(deepClone(next));toast(`Course v${next.version} published — learner records unchanged`);renderOwnerV3('course')}

function cloudStopFaceoffWatchV5(){for(const u of cloudV5.faceoffUnsubs.splice(0)){try{u()}catch(_){}}cloudV5.watchedRoom=null}

function timeHueV61(r){
 r=Math.max(0,Math.min(1,r));
 if(r<=.55)return 125-(r/.55)*20;          // green for most of the comfortable window
 if(r<=.75)return 105-((r-.55)/.20)*50;   // green-yellow -> yellow
 if(r<=.90)return 55-((r-.75)/.15)*25;    // yellow -> orange
 return 30-((r-.90)/.10)*30;              // orange -> red
}

 const fill=document.getElementById('masteryTimeFill'),panel=document.getElementById('masteryTimePanel'),status=document.getElementById('masteryTimeStatus');if(!fill)return;
 const sec=(performance.now()-a.started)/1000,target=a.courseSnapshot?.targetSec||fluencyTarget(a.level),r=target?sec/target:0;
 fill.style.width=`${Math.min(100,r*100)}%`;fill.style.backgroundColor=`hsl(${timeHueV61(r)} 67% 43%)`;
 if(panel)panel.classList.toggle('overtime',r>1);
 if(status){status.textContent=r<.55?'Comfortable pace':r<.75?'Keep going':r<.90?'Time is moving on':r<=1?'Near the mastery time':'Target time passed — finish accurately';}
}

}
function fluencyLinkForSkillV64(skillId){
 const linked=FLUENCY_OPERATIONS.flatMap(o=>courseLevelsV3(o.id)).filter(l=>l.active!==false&&l.skillId===skillId);
 if(!linked.length)return null;
 const next=linked.find(l=>!fluencyLevelState(l.id).mastered&&fluencyUnlocked(l))||linked.find(l=>!fluencyLevelState(l.id).mastered)||linked[linked.length-1];
 const allDone=linked.every(l=>fluencyLevelState(l.id).mastered);
 return{level:next,allDone};
}

function makeHelperQuestionsV64(level,count=12){
 const bank=shuffle(makeFluencyBank(level));
 if(bank.length>=count)return bank.slice(0,count).map(q=>({...q}));
 const out=[];while(out.length<count&&bank.length)out.push({...bank[out.length%bank.length]});return shuffle(out);
}
function startFluencyHelperV64(levelId){
 const level=effectiveFluencyV3(levelId);if(!level)return;
 if(!fluencyUnlocked(level)){const missing=fluencyMissingPrereqsV64(level);return alert(`This Fluency step is not open yet. First master: ${missing.join(' + ')||'the earlier step'}.`)}
 activeFluencyHelperV64={level,questions:makeHelperQuestionsV64(level,12),index:0,items:[],started:Date.now()};
 window.scrollTo({top:0,behavior:'auto'});renderFluencyHelperQuestionV64();
}
function renderFluencyHelperQuestionV64(){
 const a=activeFluencyHelperV64;if(!a)return;if(a.index>=a.questions.length)return finishFluencyHelperV64();
 const q=a.questions[a.index],pct=Math.round(a.index/a.questions.length*100);a.q=q;a.qStarted=Date.now();
 render(`<div class="question-wrap helper-session-v64"><div class="session-top"><button class="back" id="helperExit">← Exit</button><div class="progress"><span style="width:${pct}%"></span></div><div class="timer">${a.index+1}/${a.questions.length}</div></div><section class="card qcard"><div class="qmeta">🌱 PRACTICE FOR FLUENCY • ${esc(a.level.name)}</div><h2 class="helper-no-timer">No timer — learn it first</h2><div class="qprompt">${esc(q.prompt)}</div><div class="answer-row"><input id="helperAnswer" autocomplete="off" inputmode="numeric" aria-label="Answer"><button class="cta" id="helperCheck">Answer</button></div><div class="feedback" id="helperFeedback"></div><div class="hint">These are the same kinds of facts you will meet in <strong>${esc(a.level.name)}</strong>. Get comfortable here, then try mastery.</div></section></div>`,'practice');
 document.getElementById('helperExit').onclick=()=>{activeFluencyHelperV64=null;renderPractice()};
 const inp=document.getElementById('helperAnswer');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')submitFluencyHelperV64(inp.value)};document.getElementById('helperCheck').onclick=()=>submitFluencyHelperV64(inp.value);
}
function submitFluencyHelperV64(raw){
 const a=activeFluencyHelperV64,q=a?.q;if(!a||!q)return;const ms=Date.now()-a.qStarted,ok=String(raw).trim()===String(q.answer);a.items.push({skill:a.level.skillId||null,correct:ok,ms,prompt:q.prompt,answer:q.display,raw});
 const fb=document.getElementById('helperFeedback');fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?pick(['✓ Nice one!','✓ You’ve got it!','✓ Great — keep going!']):`Nearly — the answer is ${q.display}. This one will come back once.`;
 document.getElementById('helperAnswer').disabled=true;document.getElementById('helperCheck').disabled=true;
 if(!ok&&!q._retry)a.questions.push({...q,_retry:true});
 setTimeout(()=>{a.index++;renderFluencyHelperQuestionV64()},ok?500:1050);
}
function finishFluencyHelperV64(){
 const a=activeFluencyHelperV64;if(!a)return;const attempts=a.items.length,correct=a.items.filter(x=>x.correct).length,pct=Math.round(correct/Math.max(1,attempts)*100),level=a.level;logSession('Fluency Helper Practice',a.items,Math.round((Date.now()-a.started)/1000),{fluencyLevel:level.id,practiceOnly:true,helperPractice:true});save();activeFluencyHelperV64=null;
 render(`<section class="card complete"><div class="score">${pct}%</div><h1>${pct===100?'That looked comfortable! 🌟':pct>=80?'Getting stronger! 💪':'Good practice — keep building 🌱'}</h1><p class="muted">You practised the facts that prepare you for <strong>${esc(level.name)}</strong>. Practice does not count as mastery, so there is no pressure here.</p><div class="button-row" style="justify-content:center"><button class="cta" id="helperAgain">Practise again</button><button class="cta secondary" id="helperMastery">Try ${esc(level.name)} mastery</button><button class="cta secondary" id="helperPracticeHome">Practice Zone</button></div></section>`,'practice');

function arcadeChoicesV610(q,level,count=6){
 const correct=Number(q.answer),answers=[...new Set(makeFluencyBank(level).map(x=>Number(x.answer)).filter(Number.isFinite))].filter(x=>x!==correct),near=[];
 for(let d=1;d<=12;d++){if(correct-d>=0)near.push(correct-d);near.push(correct+d)}

}

function faceoffRaceStartsMsV68(round){
 if(!round)return 0;
 const direct=round.raceStartsAt;
 if(direct?.toMillis)return direct.toMillis();
 if(direct){const ms=new Date(cloudIsoV5(direct)||direct).getTime();if(Number.isFinite(ms))return ms}
 const begun=round.countdownStartedAt||round.startedAt;
 if(begun?.toMillis)return begun.toMillis()+FACE_OFF_READY_MS_V68;
 if(begun){const ms=new Date(cloudIsoV5(begun)||begun).getTime();if(Number.isFinite(ms))return ms+FACE_OFF_READY_MS_V68}

// V6.8: always make an opened Face-Off room live. The old caller often passed
// false, which meant Firebase changed but the other browser never rerendered.
cloudWatchFaceoffV5=async function(code){

 const key=cloudFaceoffKeyV5(code),{doc,onSnapshot,collection}=cloudV5.mods;
 cloudV5.watchedRoom=key;
 const myWatch=++faceoffWatchRefreshSeqV68;
 let refreshNo=0;
 const refresh=async()=>{
  const mine=++refreshNo;
  try{
   const room=await cloudAssembleRoomV5(key);
   if(!room||cloudV5.watchedRoom!==key||myWatch!==faceoffWatchRefreshSeqV68||mine!==refreshNo)return;
   if(!activeFaceoffV4&&document.querySelector('[data-nav="faceoff"].active'))renderFaceoffRoomV4(room.id);
  }catch(e){console.warn('Face-Off live refresh',e)}

 cloudV5.faceoffUnsubs.push(onSnapshot(doc(cloudV5.db,'faceoffs',key),refresh));
 cloudV5.faceoffUnsubs.push(onSnapshot(collection(cloudV5.db,'faceoffs',key,'players'),refresh));

 if(!room||room.hostChildId!==platformV3.activeChildId||!faceoffCanStartV4(room))return;
 const next=(room.rounds?.length||0)+1;if(room.matchFormat===3&&next>3)return;

   if(rnd()<.35)correct=Math.max(0,room.questionCount-1);if(rnd()<.12)correct=Math.max(0,correct-1);

   await cloudV5.mods.setDoc(cloudFaceoffPlayerRefV5(room.code,p.childId),{live:{answered:room.questionCount,round:next,finished:true}},{merge:true});
  }

 }catch(e){if(startBtn){startBtn.disabled=false;startBtn.textContent='Start round'}alert(cloudErrV5(e))}

 const x=arcadeLearningLevelV616(l.id),recent=x.recent.slice(-30),attempts=recent.length,first=recent.filter(r=>r.first).length,accuracy=attempts?Math.round(first/attempts*100):0;

ARCADE_GAMES_V610.sweet.blurb='Match three mathematically equivalent sweets, then trigger cascades and Sugar Rush.';ARCADE_GAMES_V610.sweet.tag='Equivalence + match-3';
function sweetEquivalentLabelV628(value,i,a){
 const n=Number(value),op=a?.level?.op||'';if(!Number.isFinite(n))return String(value);const variants=[String(n)];
 if(Number.isInteger(n)){
  if(op==='add'){const k=1+(Math.abs(i+n)%Math.max(1,Math.min(6,n+1)));if(n>=k)variants.push(`${n-k}+${k}`);variants.push(`${n+2}−2`);if(n>=2)variants.push(`${n-1}+1`)}
  else if(op==='sub'){variants.push(`${n+2}−2`,`${n+5}−5`);if(n>=1)variants.push(`${n+1}−1`)}
  else if(op==='mult'){for(let f=2;f<=10;f++)if(n>0&&n%f===0&&n/f<=12){variants.push(`${f}×${n/f}`);if(variants.length>=4)break}if(n>0)variants.push(`${n}×1`)}
  else if(op==='div'){variants.push(`${n*2}÷2`,`${n*3}÷3`);if(n>0)variants.push(`${n*4}÷4`)}
  else{if(n>=2)variants.push(`${n-1}+1`);variants.push(`${n+2}−2`)}
 }
 if(Math.abs(n-.5)<1e-9)variants.push('½','50%');if(Math.abs(n-.25)<1e-9)variants.push('¼','25%');if(Math.abs(n-.75)<1e-9)variants.push('¾','75%');
 // Let one correct sweet occasionally show the exact question expression.
 if(Number(n)===Number(a?.q?.answer)&&a?.q?.prompt)variants.push(String(a.q.prompt));
 return variants[Math.abs((i*7+Math.round(n*11)))%variants.length];
}
